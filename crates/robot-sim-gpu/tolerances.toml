# GPU-vs-CPU agreement records for robot-sim-gpu.
#
# Each [[scenario]] names one kernel comparison, its tier, the tolerance the
# test asserts, and the measured maxima on each device.
#
# Two bound kinds:
# - Absolute records (no `tolerance_rel` key): `measured_max_*` is the maximum
#   absolute |gpu - cpu| and must be <= `tolerance_abs`.
# - Combined records (with `tolerance_rel`): the test bound is
#   `tolerance_abs + tolerance_rel * |cpu|`. `measured_worst_ratio_*` is the
#   worst |gpu - cpu| / bound and must be <= 1. `measured_max_*` is the largest
#   absolute error seen, which can exceed `tolerance_abs` by design.
#
# `measured_*` values come from the named tests run with `--nocapture` on Intel
# iGPU (Vulkan) and Mesa Lavapipe, and from `cargo run -p robot-sim-gpu
# --features cubecl --example gpu_latency` for the RK4 and impedance rows. They
# are agreement facts against the CPU f64 reference, not MuJoCo parity. The
# feature-off test `tolerance_records_are_complete_and_hold` parses this file
# and checks every measured value against its bound.

[[scenario]]
name = "rk4_pendulum_theta_1000_steps"
kernel = "rk4_pendulum_kernel"
tier = "trajectory"
envs = 4097
steps = 1000
dt = 0.001
tolerance_abs = 1e-4
measured_max_intel = 1.122e-5
measured_max_lavapipe = 1.131e-5
measured_index_intel = 4091
measured_index_lavapipe = 4091
test = "rk4_pendulum_4097_envs_1000_steps_match_cpu_within_recorded_tolerance (asserted); gpu_latency example; rk4_pendulum_matches_cpu_closure_reference (50 steps, 4 envs)"

