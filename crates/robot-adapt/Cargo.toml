[package]
name = "robot-adapt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Limited-data adaptation: the Section 11.3 ladder, system identification, history encoders, simulator correction, bounded residuals, gated fine-tuning, retrieval and morphology (SPECS.md Section 11.3)"

[dependencies]
robot-types = { path = "../robot-types" }
robot-model = { path = "../robot-model" }
robot-nn = { path = "../robot-nn" }
robot-artifacts = { path = "../robot-artifacts" }
robot-learn = { path = "../robot-learn", optional = true }

[features]
# Offline fitting (encoders, fine-tuning). Off in a deployable build.
default = ["training"]
training = ["dep:robot-learn"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
