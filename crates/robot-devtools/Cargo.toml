[package]
name = "robot-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Development-time automation: the exclusion gate, the dependency knowledge base with staleness sweeps, and evidence-ledger diffing (SPECS.md Sections 2.3.1, 3, 13.1)"

[dependencies]
robot-types = { path = "../robot-types" }
robot-artifacts = { path = "../robot-artifacts" }

[[bin]]
name = "devtools"
path = "src/bin/devtools.rs"

[[bin]]
name = "exclusion-gate"
path = "src/bin/exclusion_gate.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
