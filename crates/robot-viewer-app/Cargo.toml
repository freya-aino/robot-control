[package]
name = "robot-viewer-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "NOASSERTION"
publish = false
description = "Offline replay viewer over robot-viewer's data layer; Bevy rendering behind the off-by-default `bevy` feature (ADR 0019/0024)"

[features]
default = []
bevy = ["dep:bevy"]

[dependencies]
robot-types = { path = "../robot-types" }
robot-model = { path = "../robot-model" }
robot-artifacts = { path = "../robot-artifacts" }
robot-viewer = { path = "../robot-viewer" }
# The feature set is `3d` minus `default_platform`, reassembled by hand so
# the wayland backend (whose `wayland-sys` needs a system `wayland-client`
# dev package the devenv deliberately does not carry) stays out: X11 under
# XWayland is the qualified windowing path (ADR 0024).
bevy = { version = "=0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "3d_bevy_render",
    "3d_api",
    "bevy_pbr",
    "bevy_gizmos_render",
], optional = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[[bin]]
name = "robot-viewer-app"
required-features = ["bevy"]
