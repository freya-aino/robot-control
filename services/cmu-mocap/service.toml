format = "data-source/1"
name = "cmu-mocap"
capability = "Human motion capture trials (including boxing, subjects 13-15 among others) as per-trial C3D marker files and ASF/AMC skeletons, for retargeting references and task curation"
class = "dataset"
scope = "motion-only"
evidence_state = "code_inspected"
access = "Public HTTP download from mocap.cs.cmu.edu, per-trial files (subjects/<s>/<s>_<t>.c3d), no registration; the site asks not to be crawled, so files are fetched individually"
output_format = "c3d marker trials (120 Hz) and asf/amc skeletons; the committed ingestion path reads the C3D directly"
ingest_command = "robot data import <trial.c3d> --store <dir> --license CMU-Graphics-Lab-Motion-Capture --training"
license_disposition = "Audited 2026-11-15 from the database's own front page: 'This dataset of motions is free for all uses'; inclusion in commercially-sold products allowed, direct resale (even converted) forbidden; requested acknowledgment 'The data used in this project was obtained from mocap.cs.cmu.edu. The database was created with funding from NSF EIA-0196217.' Files are fetched under these terms, never vendored into this repository"
